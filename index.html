<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Storm Drain Squad</title>
<style>
  :root { --pan: rgba(14,22,32,.80); --line: rgba(255,255,255,.18); --acc: #ffb020; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc3e6; color: #fff;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hide { display: none !important; }
  .pan { position: fixed; z-index: 5; background: var(--pan); border: 1px solid var(--line); border-radius: 14px; }
  .btn { background: rgba(255,255,255,.08); border: 1px solid var(--line); color: #fff; border-radius: 10px;
    padding: 6px 10px; font: inherit; font-size: 14px; font-weight: 700; }

  #job { left: 12px; top: 12px; width: min(340px, 64vw); padding: 10px 12px; }
  .jt { font-weight: 800; font-size: 16px; color: var(--acc); margin-bottom: 4px; }
  #nav { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; }
  #arrow { display: inline-block; font-size: 22px; color: var(--acc); width: 26px; text-align: center; }
  .st { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 3px 0; opacity: .7; }
  .st .ck { width: 18px; text-align: center; }
  .st .pc { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
  .st.next { opacity: 1; font-weight: 800; }
  .st.done { opacity: .65; color: #8ff0a4; }
  #hint { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 13px; color: #ffe9b8; min-height: 16px; }

  #top { right: 12px; top: 12px; display: flex; gap: 8px; align-items: center; padding: 6px 8px; }
  #cash { font-weight: 900; color: #8ff0a4; font-size: 17px; padding: 0 4px; }
  #found { font-size: 18px; }

  #pipe { right: 12px; top: 66px; padding: 6px; }
  #pipecam { display: block; width: 300px; height: 180px; border-radius: 8px; max-width: 44vw; height: auto; }

  #tools { left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; }
  .tool { width: 72px; height: 70px; border-radius: 12px; border: 2px solid var(--line); background: rgba(255,255,255,.06);
    color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
  .tool .ic { font-size: 26px; line-height: 1; }
  .tool .nm { font-size: 11px; font-weight: 800; }
  .tool .k { position: absolute; top: 3px; left: 6px; font-size: 10px; opacity: .55; }
  .tool.on { background: #fff3cf; color: #222; border-color: var(--acc); }
  .tool.want { animation: pulse .9s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255,176,32,.55); border-color: var(--acc); } }

  #vac { left: 50%; bottom: 104px; transform: translateX(-50%); padding: 8px 10px; display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 700; }
  #gauge { width: 130px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.15); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #8a5a2b, #c98a3a); }

  #stick { position: fixed; left: 24px; bottom: 24px; width: 150px; height: 150px; border-radius: 50%; z-index: 6; display: none;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: rgba(255,255,255,.6); }
  #use { position: fixed; right: 24px; bottom: 30px; width: 124px; height: 124px; border-radius: 50%; z-index: 6; display: none;
    background: rgba(255,176,32,.9); border: 4px solid #fff; font: inherit; font-weight: 900; font-size: 24px; color: #222; touch-action: none; }
  #use.down { background: #fff; transform: scale(.94); }
  body.touch #stick, body.touch #use { display: block; }
  body.touch .tool .k { display: none; }

  #toast { position: fixed; left: 50%; bottom: 190px; transform: translateX(-50%); z-index: 7; background: #fff; color: #222; font-weight: 800;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }

  #banner { position: fixed; left: 50%; top: 30%; transform: translate(-50%,-50%); z-index: 8; text-align: center;
    background: rgba(14,22,32,.88); border: 3px solid var(--acc); border-radius: 22px; padding: 18px 34px; }
  #banner .big { font-size: 44px; font-weight: 900; color: var(--acc); letter-spacing: 1px; }
  #bannerSub { font-size: 18px; font-weight: 700; margin: 4px 0 10px; }

  #start { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(10,25,45,.55), rgba(10,25,45,.25)); }
  #start .card { background: rgba(14,22,32,.86); border: 2px solid var(--line); border-radius: 24px; padding: 26px 34px; text-align: center; max-width: 92vw; }
  #start h1 { margin: 0; font-size: clamp(34px, 7vw, 62px); font-weight: 900; color: var(--acc); letter-spacing: 1px; }
  #start p { margin: 8px 0 14px; font-size: 17px; }
  #start .how { font-size: 14px; line-height: 1.7; opacity: .9; margin-bottom: 16px; }
  #play { font: inherit; font-size: 26px; font-weight: 900; padding: 12px 54px; border-radius: 16px; border: 0; background: var(--acc); color: #222; }
  #err { position: fixed; inset: 0; z-index: 30; background: #14202b; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 18px; }

  @media (max-width: 720px) {
    .tool { width: 56px; height: 60px; } .tool .ic { font-size: 21px; } .tool .nm { font-size: 9px; }
    #stick { width: 120px; height: 120px; bottom: 96px; left: 14px; } #use { width: 96px; height: 96px; bottom: 100px; right: 14px; font-size: 19px; }
    #top .btn { padding: 5px 7px; font-size: 12px; } #toast { bottom: 230px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="job" class="pan">
  <div id="jt" class="jt"></div>
  <div id="nav"><span id="arrow">&#9650;</span><span id="navText"></span></div>
  <div id="steps"></div>
  <div id="hint"></div>
</div>

<div id="top" class="pan">
  <span id="cash">$0</span><span id="found"></span>
  <button id="btnSound" class="btn">&#128266;</button>
  <button id="btnGfx" class="btn">Fancy</button>
</div>

<div id="pipe" class="pan hide"><canvas id="pipecam" width="300" height="180"></canvas></div>
<div id="vac" class="pan hide"><span>Vac tank</span><div id="gauge"><div id="fill"></div></div><button id="empty" class="btn">EMPTY</button></div>
<div id="tools" class="pan"></div>
<div id="stick"><div id="knob"></div></div>
<button id="use">USE</button>
<div id="toast"></div>
<div id="banner" class="hide"><div class="big" id="bannerBig"></div><div id="bannerSub"></div><button id="again" class="btn hide">Start a new storm</button></div>

<div id="start">
  <div class="card">
    <h1 id="title"></h1>
    <p>A big storm blocked every drain in town. Grab your tools!</p>
    <div class="how" id="how"></div>
    <button id="play">PLAY</button>
  </div>
</div>
<div id="err" class="hide">The game could not load its 3D engine.<br>Check that this device is connected to the internet, then reload.</div>

<script>
  // If the 3D engine has not started after a while, tell the player why.
  setTimeout(function () { if (!window.__booted) document.getElementById('err').classList.remove('hide'); }, 12000);
</script>
<script type="importmap">

} }
</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const GAME_NAME = 'Storm Drain Squad';     // <-- change the name of the game here!

// =====================================================================
//  Little helpers
// =====================================================================
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;

const store = {
  get(k, d) { try { const v = localStorage.getItem('sds.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sds.' + k, JSON.stringify(v)); } catch (e) {} },

const coarse = matchMedia('(pointer: coarse)').matches;

// =====================================================================

const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe0ea, 70, 250);
const camera = new THREE.PerspectiveCamera(60, 1, 0.3, 600);

const SUN_DIR = new THREE.Vector3(-0.5, 0.72, 0.48).normalize();
function makeSkyDome() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2c62b0'); gr.addColorStop(0.3, '#5f9bd8'); gr.addColorStop(0.47, '#bcd9ee');
  gr.addColorStop(0.5, '#e6eef2'); gr.addColorStop(0.53, '#cfe0ea'); gr.addColorStop(1, '#b8cbd6');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.SphereGeometry(420, 24, 16),
    new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false, depthWrite: false }));
}
const sky = makeSkyDome(); scene.add(sky);
{
  // The sky is also used as a "mirror picture" so wet and shiny things can reflect it.
  const envScene = new THREE.Scene(); envScene.add(makeSkyDome());
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(22, 16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(40, 34, 24), fog: false }));
  sunBall.position.copy(SUN_DIR).multiplyScalar(380); envScene.add(sunBall);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.01, 1, 1000).texture;
  pm.dispose();
}
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x556b3a, 0.5));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 170 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

// =====================================================================
//  Painted textures (drawn with code, so there are no picture files)
// =====================================================================
function makeTexture(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
function speckle(g, s, n, colors, r0, r1) {
  for (let i = 0; i < n; i++) { g.fillStyle = colors[i % colors.length]; g.beginPath(); g.arc(rand(s), rand(s), rand(r0, r1), 0, TAU); g.fill(); }
}
const asphaltTex = makeTexture(256, (g, s) => {
  g.fillStyle = '#33363b'; g.fillRect(0, 0, s, s);
  speckle(g, s, 2600, ['#2a2d31', '#3c3f45', '#45494f', '#2f3236', '#4b4f55'], .5, 1.5);
  g.strokeStyle = 'rgba(18,18,20,.5)'; g.lineWidth = 1;
  for (let i = 0; i < 5; i++) { g.beginPath(); let x = rand(s), y = rand(s); g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += rand(-22, 22); y += rand(-22, 22); g.lineTo(x, y); } g.stroke(); }
});
// Dark spots here make shiny wet patches on the road.
const wetTex = makeTexture(256, (g, s) => {
  g.fillStyle = '#c4c4c4'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 22; i++) {
    const x = rand(s), y = rand(s), r = rand(10, 34), gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(60,60,60,.95)'); gr.addColorStop(.6, 'rgba(60,60,60,.7)'); gr.addColorStop(1, 'rgba(60,60,60,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
});
wetTex.colorSpace = THREE.NoColorSpace; wetTex.repeat.set(4 / 23, 4 / 23);
const grassTex = makeTexture(256, (g, s) => {
  g.fillStyle = '#4d8c3b'; g.fillRect(0, 0, s, s); g.lineWidth = 1.3;
  for (let i = 0; i < 2600; i++) { g.strokeStyle = pick(['#3f7a31', '#5a9b45', '#6aa84f', '#447f35', '#57903f']); const x = rand(s), y = rand(s); g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(-3, 3), y - rand(4, 9)); g.stroke(); }
});
const concreteTex = makeTexture(128, (g, s) => {
  g.fillStyle = '#b9b6ad'; g.fillRect(0, 0, s, s);
  speckle(g, s, 500, ['#aaa79e', '#c6c3ba', '#9e9b93'], .5, 1.4);
  g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 3; g.strokeRect(0, 0, s, s);
});
const driveTex = makeTexture(128, (g, s) => {
  g.fillStyle = '#cbc8c0'; g.fillRect(0, 0, s, s);
  speckle(g, s, 500, ['#bdbab1', '#d6d3cb', '#b3b0a8'], .5, 1.4);
  g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 2; g.strokeRect(0, 0, s, s);
});
const sidingTex = makeTexture(64, (g, s) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, s, s); g.fillStyle = 'rgba(0,0,0,.14)';
  for (let y = 0; y < s; y += 8) g.fillRect(0, y, s, 1.5);
});
const roofTex = makeTexture(128, (g, s) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, s, s);
  for (let row = 0; row < 8; row++) for (let col = -1; col < 8; col++) {
    const x = col * 16 + (row % 2) * 8, y = row * 16;
    g.fillStyle = `rgba(0,0,0,${rand(0, .16)})`; g.fillRect(x, y, 16, 16);
    g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 1; g.strokeRect(x, y, 16, 16);
  }
});
const garageTex = makeTexture(64, (g, s) => {
  g.fillStyle = '#f2f2ee'; g.fillRect(0, 0, s, s); g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 1.5;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) g.strokeRect(c * 16 + 2, r * 16 + 2, 12, 12);
});
const dotTex = makeTexture(32, (g, s) => {
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const spiralTex = makeTexture(256, (g, s) => {
  const c = s / 2, gr = g.createRadialGradient(c, c, 0, c, c, c * .5);
  gr.addColorStop(0, 'rgba(8,8,10,.92)'); gr.addColorStop(1, 'rgba(8,8,10,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  g.lineCap = 'round'; g.strokeStyle = 'rgba(240,232,214,.75)'; g.lineWidth = 5;
  for (let arm = 0; arm < 5; arm++) {
    g.beginPath();
    for (let i = 2; i <= 30; i++) { const f = i / 30, a = arm * TAU / 5 - f * 3.4, x = c + Math.cos(a) * c * .94 * f, y = c + Math.sin(a) * c * .94 * f; if (i === 2) g.moveTo(x, y); else g.lineTo(x, y); }
    g.stroke();
  }

// =====================================================================
//  Materials (what things are made of)
// =====================================================================
const std = (o, flat = false) => { const m = new THREE.MeshStandardMaterial(o); m.userData.flat = flat; return m; };
const basic = (o) => { const m = new THREE.MeshBasicMaterial(o); m.userData.flat = true; return m; };
const MAT = {
  grass: std({ map: grassTex, roughness: 1 }, true),
  road: std({ map: asphaltTex, roughnessMap: wetTex, roughness: 1, envMapIntensity: 1.0 }, true),
  paint: std({ color: 0xe9e9e2, roughness: .6 }, true),
  walk: std({ map: concreteTex, roughness: .9 }),
  curb: std({ color: 0xd4d1c8, roughness: .85 }),
  drive: std({ map: driveTex, roughness: .85 }, true),
  walls: [0xe8dcc0, 0xc9d6e2, 0xd9c2b0, 0xbfd3bd, 0xe6e1d8, 0xd7b9a0].map(c => std({ map: sidingTex, color: c, roughness: .85 })),
  roofs: [0x6b3a2e, 0x3f4650, 0x5a4636, 0x34495c].map(c => std({ map: roofTex, color: c, roughness: .8 })),
  doors: [0xb23a2e, 0x2f5d8a, 0x3c7a4a, 0x8a5a2b].map(c => std({ color: c, roughness: .5 })),
  foliage: [0x3f7d3a, 0x5a9440, 0xd9862b, 0xc4502a, 0xe0b23a].map(c => std({ color: c, roughness: .9, flatShading: true })),
  trim: std({ color: 0xf4f1ea, roughness: .7 }),
  glass: std({ color: 0x8fb8dc, roughness: .04, metalness: .9, envMapIntensity: 1.4 }),
  garage: std({ map: garageTex, roughness: .6 }),
  brick: std({ color: 0x8c4a3a, roughness: .9 }),
  hedge: std({ color: 0x2f6b34, roughness: 1 }),
  trunk: std({ color: 0x5d4330, roughness: 1 }),
  metal: std({ color: 0x8a9099, roughness: .35, metalness: .8 }),
  dark: std({ color: 0x22252a, roughness: .6 }),
  tire: std({ color: 0x17181a, roughness: .9 }),
  red: std({ color: 0xc8322a, roughness: .45 }),
  yellow: std({ color: 0xf2c21a, roughness: .45 }),
  blue: std({ color: 0x2f6fb0, roughness: .5 }),
  orange: std({ color: 0xff7a1a, roughness: .5 }),
  white: std({ color: 0xf5f5f2, roughness: .35 }),
  wood: std({ color: 0x9a6b3c, roughness: .8 }),
  lamp: std({ color: 0xfff3c4, emissive: 0xffe9a0, emissiveIntensity: .6 }),
  iron: std({ color: 0x3a3d42, roughness: .5, metalness: .7 }),
  hill: std({ color: 0x3d6b3a, roughness: 1 }, true),
  hole: basic({ color: 0x050607 }),
  cloud: basic({ color: 0xffffff, fog: false }),
};

// =====================================================================
//  Building the town. Everything that never moves gets glued together
//  into a few big pieces, which keeps the game fast on a tablet.
// =====================================================================
const batches = new Map();
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
function place(geo, mat, x, y, z, ry = 0, sx = 1, sy = 1, sz = 1, rx = 0, rz = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  _m4.compose(_p.set(x, y, z), _q.setFromEuler(_e.set(rx, ry, rz)), _s.set(sx, sy, sz));
  g.applyMatrix4(_m4);
  if (!batches.has(mat)) batches.set(mat, []);
  batches.get(mat).push(g);
}
function finishStatic() {
  for (const [mat, list] of batches) {
    const mesh = new THREE.Mesh(mergeGeometries(list), mat);
    mesh.castShadow = !mat.userData.flat; mesh.receiveShadow = true;
    scene.add(mesh);
  }
  batches.clear();
}
function sBox(w, h, d, mat, x, y, z, tile = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (tile) {   // make the texture repeat every "tile" metres
    const uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile); }
  }
  place(g, mat, x, y, z);
}
function sPlane(w, d, mat, x, z, y, tile = 0) {
  const g = new THREE.PlaneGeometry(w, d);
  if (tile) { const uv = g.attributes.uv; for (let i = 0; i < 4; i++) uv.setXY(i, uv.getX(i) * w / tile, uv.getY(i) * d / tile); }
  g.rotateX(-Math.PI / 2);
  place(g, mat, x, y, z);
}
function sCyl(rt, rb, h, mat, x, y, z, seg = 10, rx = 0, rz = 0) {
  place(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, 0, 1, 1, 1, rx, rz);

  pts.frustumCulled = false; scene.add(pts);

}

function updatePoints(sys, dt, gravity) {
  const p = sys.pos;

    sys.life[i] -= dt;
    if (sys.life[i] <= 0) { p.setY(i, -100); continue; }
    sys.vel[i * 3 + 1] -= gravity * dt;

  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const loop = name => { const g = ac.createGain(); g.gain.value = 0; g.connect(master); sfx.loops[name] = g; return g; };
  const filt = (type, f, q = 1) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
  const osc = (type, f) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; };
  // gurgling drain

  wob.connect(wg); wg.connect(gf.frequency); noise.connect(gf); gf.connect(loop('gurgle'));
  // hissing spray

  // pressure washer engine
  const ef = filt('lowpass', 300); osc('square', 58).connect(ef); osc('square', 87.5).connect(ef); ef.connect(loop('engine'));
  // shop vac motor

}
function setLoop(name, vol) { const g = sfx.loops[name]; if (g) g.gain.setTargetAtTime(vol, sfx.ctx.currentTime, .06); }
function blip(f0, f1, dur, vol = .12, type = 'sine') {
  const ac = sfx.ctx; if (!ac || sfx.muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);

}

// The fancy flood water is a real mirror with ripples.
const WATER_SHADER = {

  vertexShader: `

}
const PRIZE_ICON = { duck: '\u{1F986}', boot: '\u{1F97E}', coin: '\u{1FA99}' };

class Job {

  waterY() { return .03 + .075 * this.level; }

    if (f.kind === 'half') return dx * dx + dz * dz < (f.r * s) * (f.r * s) && dx * this.faceVec[0] + dz * this.faceVec[1] > 0;

  // ---------- building the parts ----------
  buildGrate() {

  }
  buildFlood() {

  buildInstances() {

      else if (f.kind === 'half') { const a = f.face + rand(-1.35, 1.35), r = rand(1.4, f.r * .85); x = this.fx + Math.cos(a) * r; z = this.fz + Math.sin(a) * r; }

  // ---------- what the tools do ----------
  rake(a, prev, dt) {
    const mx = clamp(a.x - prev.x, -.6, .6), mz = clamp(a.z - prev.z, -.6, .6);

      for (const p of list) {

  const all = jobs.every(j => j.done);
  $('bannerBig').textContent = all ? 'TOWN SAVED!' : 'JOB DONE!';
  $('bannerSub').textContent = all ? `Every drain is clear. You earned $${cash} so far!` : `${job.title}  +$${job.pay}`;
  $('again').classList.toggle('hide', !all);
  $('banner').classList.remove('hide');
  clearTimeout(onJobDone.timer);
  if (!all) onJobDone.timer = setTimeout(() => $('banner').classList.add('hide'), 3800);
}

// ---- The pipe camera, for the drain snake ----
const pipeCtx = $('pipecam').getContext('2d');
function drawPipeCam(job) {
  const g = pipeCtx, W = 300, H = 180, clogX = 222, busted = job.clogHp <= 0;
  g.fillStyle = '#4b3a2a'; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(0,0,0,.18)'; for (let i = 0; i < 26; i++) { g.beginPath(); g.arc((i * 73) % W, 30 + (i * 41) % 140, 2 + i % 4, 0, TAU); g.fill(); }
  g.fillStyle = '#3d4046'; g.fillRect(0, 0, W, 24);
  g.fillStyle = '#8d8f93'; g.fillRect(30, 18, 40, 134); g.fillRect(30, 104, 270, 48);
  g.fillStyle = '#15171a'; g.fillRect(36, 12, 28, 134); g.fillRect(36, 110, 264, 36);
  if (!busted) { g.fillStyle = 'rgba(122,100,60,.9)'; g.fillRect(36, 26, 28, 120); g.fillRect(36, 110, clogX - 36, 36); }
  else { g.fillStyle = 'rgba(110,130,140,.75)'; g.fillRect(36, 132, 264, 14); g.strokeStyle = 'rgba(220,235,245,.7)'; g.lineWidth = 2; for (let i = 0; i < 9; i++) { const x = 36 + ((T * 160 + i * 31) % 264); g.beginPath(); g.moveTo(x, 135 + (i % 3) * 3); g.lineTo(Math.min(300, x + 14), 135 + (i % 3) * 3); g.stroke(); } }
  g.fillStyle = '#5b5f66'; for (let i = 0; i < 4; i++) g.fillRect(38 + i * 7, 12, 3, 12);
  if (!busted) {     // the clog: a lump of roots, leaves and gunk
    const s = .45 + .55 * job.clogHp, shake = job.cable >= CLOG_DEPTH ? Math.sin(T * 40) * 1.5 : 0;
    const lumps = [[0, 0, 15, '#5a4424'], [-9, -8, 10, '#6b5a2a'], [8, 7, 11, '#4a3a1e'], [10, -9, 9, '#5f6a32'], [-10, 9, 9, '#3f3018'], [16, 0, 8, '#6d4f28'], [2, -12, 7, '#7a8a2a']];
    for (const [ox, oy, r, c] of lumps) { g.fillStyle = c; g.beginPath(); g.arc(clogX + 8 + ox * s + shake, 128 + oy * s, r * s, 0, TAU); g.fill(); }
  }
  // the cable
  const path = 128 + (clogX - 12 - 50), len = job.cable / CLOG_DEPTH * path;
  g.strokeStyle = '#c9ced6'; g.lineWidth = 3; g.lineJoin = 'round'; g.beginPath(); g.moveTo(50, 0);
  let tx = 50, ty = Math.min(len, 128);
  g.lineTo(50, ty);
  if (len > 128) { tx = 50 + (len - 128); ty = 128; g.lineTo(tx, 128); }
  g.stroke();
  if (len > 2) {     // the spinning cutter on the end
    const spin = T * 30, down = len <= 128;
    g.strokeStyle = '#ffd23a'; g.lineWidth = 2.5; g.beginPath();
    for (let i = 0; i <= 8; i++) { const o = Math.sin(spin + i * 1.5) * 5; if (down) g.lineTo(tx + o, ty + i * 1.6); else g.lineTo(tx + i * 1.6, ty + o); }
    g.stroke();
  }
  g.fillStyle = '#fff'; g.font = '700 12px system-ui, sans-serif'; g.textAlign = 'left'; g.fillText('PIPE CAM', 82, 16);
  g.fillStyle = Math.sin(T * 6) > 0 ? '#ff4040' : '#701010'; g.beginPath(); g.arc(150, 12, 4, 0, TAU); g.fill();
  g.fillStyle = '#ffe9b8'; g.textAlign = 'right';
  g.fillText(busted ? 'PIPE CLEAR!' : job.cable < CLOG_DEPTH ? `Cable ${job.cable.toFixed(1)} m` : `Clog ${Math.ceil(job.clogHp * 100)}%`, 292, 172);
}

// =====================================================================
//  The screen words (job list, arrow, money)
// =====================================================================
let lastSteps = '', hudTimer = 0, navJob = null;
function nextJob() { let best = null, bd = 1e9; for (const j of jobs) { if (j.done) continue; const d = Math.hypot(j.x - P.x, j.z - P.z); if (d < bd) { bd = d; best = j; } } return best; }
function refreshHud() {
  const j = activeJob; let want = null, html = '';
  if (j && !j.done) {
    const steps = j.steps(), next = steps.find(s => !s.done);
    $('jt').textContent = j.title;
    html = steps.map(s => `<div class="st${s.done ? ' done' : ''}${s === next ? ' next' : ''}"><span class="ck">${s.done ? '✔' : s === next ? '➤' : '•'}</span><span>${s.label}</span><span class="pc">${Math.floor(s.pct * 100)}%</span></div>`).join('');
    $('hint').textContent = next ? next.hint : '';
    $('nav').classList.add('hide'); navJob = null;
    want = next ? next.tool : null;
  } else {
    navJob = nextJob();
    $('jt').textContent = j ? 'This job is done!' : navJob ? 'Next job' : 'All jobs done!';
    $('nav').classList.toggle('hide', !navJob);
    if (navJob) $('navText').textContent = `${navJob.title} · ${Math.round(Math.hypot(navJob.x - P.x, navJob.z - P.z))} m`;
    $('hint').textContent = navJob ? 'Follow the arrow to the orange light beam.' : 'You cleaned up the whole town!';
  }
  if (html !== lastSteps) { $('steps').innerHTML = html; lastSteps = html; }
  for (const b of $('tools').children) b.classList.toggle('want', b.dataset.tool === want && want !== tool);
  $('cash').textContent = '$' + cash;
  $('found').textContent = [...new Set(found)].map(k => PRIZE_ICON[k]).join('');
  $('fill').style.width = (tank.fill / tank.cap * 100) + '%';
  $('empty').style.background = tank.fill >= tank.cap ? '#ffb020' : '';
}

// =====================================================================
//  The game loop: this runs about 60 times every second
// =====================================================================
function collide() {
  const r = .42;
  for (const b of boxes) {
    if (P.x > b.x0 - r && P.x < b.x1 + r && P.z > b.z0 - r && P.z < b.z1 + r) {
      const dl = P.x - (b.x0 - r), dr = (b.x1 + r) - P.x, dn = P.z - (b.z0 - r), df = (b.z1 + r) - P.z, m = Math.min(dl, dr, dn, df);
      if (m === dl) P.x = b.x0 - r; else if (m === dr) P.x = b.x1 + r; else if (m === dn) P.z = b.z0 - r; else P.z = b.z1 + r;
    }
  }
  for (const c of posts) { const dx = P.x - c.x, dz = P.z - c.z, d = Math.hypot(dx, dz), R = c.r + r * .8; if (d < R && d > 1e-4) { P.x = c.x + dx / d * R; P.z = c.z + dz / d * R; } }
  P.x = clamp(P.x, -66, 66); P.z = clamp(P.z, -66, 66);
}
function camBlocked(x, y, z) { for (const b of boxes) if (y < b.h + .3 && x > b.x0 - .3 && x < b.x1 + .3 && z > b.z0 - .3 && z < b.z1 + .3) return true; return false; }

let snakeStatus = '', fpsTime = 0, fpsFrames = 0;
function update(dt) {
  T += dt;
  // ---- walking ----
  let ix = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0) + joy.x;
  let iz = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - joy.y;
  if (keys.has('ArrowLeft')) cam.yaw += 1.9 * dt;
  if (keys.has('ArrowRight')) cam.yaw -= 1.9 * dt;
  if (!started) { cam.yaw += dt * .08; ix = iz = 0; }
  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
  const using = started && (keys.has('Space') || mouseUse || touchUse);
  const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw), rx = -fz, rz = fx;      // forward and right
  const speed = using ? 2.4 : 5.4;
  const vx = (fx * iz + rx * ix) * speed, vz = (fz * iz + rz * ix) * speed;
  P.x += vx * dt; P.z += vz * dt; collide();
  const moving = Math.hypot(vx, vz) > .2;
  P.moveAmt = lerp(P.moveAmt, moving ? 1 : 0, damp(10, dt));
  if (moving) P.phase += dt * (using ? 6 : 10);
  P.y = lerp(P.y, groundHeight(P.x, P.z), damp(14, dt));

  // ---- which job are we at? ----
  let near = null, nd = 1e9;
  for (const j of jobs) { const d = Math.hypot(j.x - P.x, j.z - P.z); if (d < j.zone && d < nd) { nd = d; near = j; } }
  if (near !== activeJob) {
    activeJob = near; lastSteps = '';
    if (near && !near.done && started) { toast(near.title, 2600); blip(440, 660, .18, .1, 'triangle'); }
  }
  const j = activeJob;

  // ---- camera ----
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const tx = P.x + rx * .9, ty = P.y + 1.75, tz = P.z + rz * .9;
  let want = cam.dist;
  for (let i = 1; i <= 8; i++) { const k = cam.dist * i / 8; if (camBlocked(tx - fx * cp * k, ty + sp * k, tz - fz * cp * k)) { want = Math.max(.9, cam.dist * (i - 1) / 8); break; } }
  cam.d = lerp(cam.d, want, damp(want < cam.d ? 30 : 6, dt));
  camera.position.set(tx - fx * cp * cam.d, ty + sp * cam.d, tz - fz * cp * cam.d);
  camera.lookAt(tx, ty, tz);
  sky.position.copy(camera.position);
  sun.target.position.set(Math.round(P.x), 0, Math.round(P.z));
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 90);

  // ---- where is the tool pointing? ----
  const TL = TOOLS[tool];
  camera.getWorldDirection(v1);
  const t = v1.y < -.03 ? Math.min(60, (.03 - camera.position.y) / v1.y) : 60;
  let ax = camera.position.x + v1.x * t - P.x, az = camera.position.z + v1.z * t - P.z;
  const ad = Math.hypot(ax, az) || 1, ar = clamp(ad, TL.min, TL.max);
  aim.set(P.x + ax / ad * ar, 0, P.z + az / ad * ar);
  if (tool === 'snake' && j && j.gw) aim.set(j.x, 0, j.z);
  const aimY = j && j.contains(aim.x, aim.z) ? j.waterY() : groundHeight(aim.x, aim.z);

  // ---- turn to face where we walk, or where we work ----
  if (using && j) P.yaw = angleLerp(P.yaw, Math.atan2(aim.x - P.x, aim.z - P.z), damp(14, dt));
  else if (moving) P.yaw = angleLerp(P.yaw, Math.atan2(vx, vz), damp(10, dt));

  // ---- use the tool ----
  snakeStatus = '';
  if (using && !j) nag('Follow the arrow and walk up to a job first!');
  if (using && j) {
    if (tool === 'rake') j.rake(aim, prevAim, dt);
    else if (tool === 'jet') { if (!j.gw) nag('There is no drain here. Try the vac or the washer!'); j.jet(aim, dt); spawnMist(aim.x, aimY + .06, aim.z, 3, 1.6); }
    else if (tool === 'snake') {
      snakeStatus = j.snake(dt);
      const msg = { none: 'This one has no deep clog. Try another tool!', far: 'Stand right next to the drain to snake it.', leaves: 'Rake the leaves off first.', mud: 'Too much mud! Jet the mud out first.', done: 'The pipe is already clear!' }[snakeStatus];
      if (msg) nag(msg);
      if (snakeStatus === 'bust') { toast('CLOG BUSTED! Here comes the water!', 3000); blip(140, 60, .6, .2, 'sawtooth'); spawnMist(j.x, .3, j.z, 40, 3); }
    }
    else if (tool === 'vac') { if (j.vac(aim, dt) === 'full') nag(coarse ? 'The vac is full! Tap EMPTY.' : 'The vac is full! Press E to empty it.'); }
    else if (tool === 'washer') { if (j.wash(prevAim, aim, dt) === 'wet') nag('Drain the water before you wash here.'); spawnMist(aim.x, aimY + .06, aim.z, 4, 2); }
  }
  prevAim.copy(aim);
  if (moving && j && j.contains(P.x, P.z) && Math.random() < dt * 14) spawnMist(P.x, j.waterY() + .05, P.z, 2, 1.1);

  // ---- move the worker's body ----
  const sw = Math.sin(P.phase) * .75 * P.moveAmt, holding = !!j;
  player.g.position.set(P.x, P.y + Math.abs(Math.sin(P.phase)) * .05 * P.moveAmt, P.z);
  player.g.rotation.y = P.yaw;
  player.legL.rotation.x = sw; player.legR.rotation.x = -sw; player.armL.rotation.x = -sw * .8;
  player.armR.rotation.x = holding ? -1.05 + (using ? Math.sin(T * 34) * .02 : 0) : sw * .8;

  // ---- show the tool, hose, spray and aiming ring ----
  toolRoot.visible = holding; hose.visible = false; beam.visible = false;
  reticle.visible = holding && tool !== 'snake';
  if (holding) {
    const px = Math.sin(P.yaw), pz = Math.cos(P.yaw);
    toolRoot.position.set(P.x + px * .42 - pz * .34, P.y + 1.08, P.z + pz * .42 + px * .34);
    toolRoot.lookAt(aim.x, aimY + .05, aim.z);
    for (const id of TOOL_IDS) toolModels[id].g.visible = id === tool;
    const tm = toolModels[tool], reachLen = toolRoot.position.distanceTo(v2.set(aim.x, aimY + .05, aim.z));
    if (tm.pole) { tm.pole.scale.z = reachLen; tm.head.position.z = reachLen; }
    if (tm.drum && using) tm.drum.rotation.x += dt * 14;
    if (tool === 'snake') { if (j.gw && Math.hypot(P.x - j.x, P.z - j.z) < 3.6) setHose(toolRoot.localToWorld(v1.set(0, 0, .3)), v2.set(j.x, -.1, j.z), .014, 0xb9c0c9, false); }
    else if (tool !== 'rake') setHose(j.anchors[tool], toolRoot.position, tool === 'vac' ? .055 : .028, tool === 'vac' ? 0x3c4046 : tool === 'jet' ? 0x2f6fb0 : 0x1c1c1c, true);
    if (using && (tool === 'jet' || tool === 'washer')) {
      toolRoot.localToWorld(v1.set(0, 0, tm.tip)); beam.position.copy(v1); beam.lookAt(aim.x, aimY + .04, aim.z);
      beam.scale.set(tool === 'washer' ? 2.6 : 1, 1, v1.distanceTo(v2.set(aim.x, aimY + .04, aim.z))); beam.visible = true;
    }
    reticle.position.set(aim.x, aimY + .07, aim.z); reticle.scale.setScalar(TL.ring * (using ? 1 + Math.sin(T * 20) * .05 : 1));
    reticle.material.color.setHex(using ? 0xffd23a : 0xffffff);
  }

  // ---- everything else ----
  let mirror = null, md = 60;
  for (const job of jobs) { const d = Math.hypot(job.x - P.x, job.z - P.z); if (job.flood && job.level > 0 && d < md) { md = d; mirror = job; } }
  for (const job of jobs) { job.useFancy = fancy && job === mirror; job.update(dt); }
  updatePoints(mist, dt, 5); updatePoints(confetti, dt, 9);
  beacon.material.emissiveIntensity = Math.sin(T * 7) > 0 ? 2.2 : .15;

  if (sfx.ctx) {
    setLoop('gurgle', j && j.flow > .03 && j.level > 0 ? .05 + .3 * j.flow : 0);
    setLoop('hiss', using && j && (tool === 'jet' || tool === 'washer') ? .14 : 0);
    setLoop('engine', j && tool === 'washer' ? (using ? .07 : .022) : 0);
    setLoop('vac', using && j && tool === 'vac' && tank.fill < tank.cap ? .13 : 0);
    setLoop('grind', snakeStatus === 'grind' || snakeStatus === 'feed' ? .1 : 0);
  }

  // ---- screen words ----
  const showPipe = !!(j && j.clog && tool === 'snake' && Math.hypot(P.x - j.x, P.z - j.z) < 3.6);
  $('pipe').classList.toggle('hide', !showPipe);
  if (showPipe) drawPipeCam(j);
  if (navJob) $('arrow').style.transform = `rotate(${-(Math.atan2(navJob.x - P.x, navJob.z - P.z) - cam.yaw)}rad)`;
  hudTimer -= dt; if (hudTimer <= 0) { hudTimer = .14; refreshHud(); }

  // ---- if the game is running slowly, switch to Fast graphics by itself ----
  fpsTime += dt; fpsFrames++;
  if (fpsTime > 4) { const fps = fpsFrames / fpsTime; fpsTime = fpsFrames = 0; if (started && autoQuality && quality > 0 && fps > 5 && fps < 24) { setQuality(quality - 1, false); toast('Switched to faster graphics so it runs smoothly.'); } }
}

const clock = new THREE.Clock();
function frame() {
  update(Math.min(clock.getDelta(), .05));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
setTool('rake'); applyQuality(); refreshHud();
window.__booted = true;
window.game = { P, cam, jobs, tank, aim, keys, setTool, setFancy, setQuality, step: update, get activeJob() { return activeJob; }, get tool() { return tool; } };
frame();
</script>
</body>
</html>
